server:
  port: 8085
spring:
  application:
    name: ms-pedidos360-report
  datasource:
    url: ${REPORT_DB_URL:jdbc:mysql://localhost:3306/db_report?useSSL=false&serverTimezone=UTC}
    username: ${REPORT_DB_USERNAME:root}
    password: ${REPORT_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: /
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0
          max-interval: 10000
        default-requeue-rejected: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    topics:
      orders: orders.events
      audit: audit.timeline
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: reportes
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.json.value.default.type]": cl.duoc.ms_pedidos360_report.dto.PedidoKafkaEvent
        "[spring.json.trusted.packages]": cl.duoc.ms_pedidos360_report.dto
        "[spring.json.use.type.headers]": false
        "[spring.deserializer.key.delegate.class]": org.apache.kafka.common.serialization.StringDeserializer
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JacksonJsonDeserializer

    listener:
      ack-mode: record
