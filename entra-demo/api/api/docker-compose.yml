
services:
  api-bff:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-bff
    ports:
      - "8080:8080"
    environment:
      ENTRA_ISSUER_URI: ${ENTRA_ISSUER_URI}
      ENTRA_API_CLIENT_ID: ${ENTRA_API_CLIENT_ID}
      MS_CLIENTES_URL: ${MS_CLIENTES_URL}
      MS_PEDIDOS_URL: ${MS_PEDIDOS_URL}
      MS_CATALOGO_URL: ${MS_CATALOGO_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
    restart: unless-stopped
