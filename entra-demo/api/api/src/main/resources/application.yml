
server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI}
          audiences:
            - ${ENTRA_API_CLIENT_ID}

microservices:
  clientes:
    base-url: ${MS_CLIENTES_URL:http://localhost:8081}
  pedidos:
    base-url: ${MS_PEDIDOS_URL:http://localhost:8082}
  catalogo:
    base-url: ${MS_CATALOGO_URL:http://localhost:8083}

internal:
  api-key: ${INTERNAL_API_KEY}
